name: hybas-medaka
channels:
- conda-forge
- bioconda
dependencies:
- python=3.12
- pip=25.3
# Keep the existing Conda CPU/GPU variant selection. Pip must not replace these.
- pytorch=2.9.1
- numpy=2.3.5
- packaging=25.0
- samtools=1.22.1
- htslib=1.22.1
- bcftools=1.22
- minimap2=2.30
# Medaka 2.2.0 declares ont-mappy/ont-parasail and pysam<=0.23.0.
# Canonical wheels avoid the conflicting mappy/parasail-python Conda aliases.
- pip:
  - torch==2.9.1
  - numpy==2.3.5
  - packaging==25.0
  - medaka==2.2.0
  - ont-mappy==2.28
  - ont-parasail==1.3.4
  - pysam==0.23.0
  - tensordict==0.10.0

name: Workflow regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install snakemake==9.6.2 pytest pyyaml
      - run: python -m pytest tests -q --basetemp=tests/.runs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-logs-${{ matrix.python }}
          path: |
            tests/.runs/**/last-run.log
            tests/.runs/**/logs/*.log

name: Workflow regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install snakemake==9.27.1 pytest pyyaml
      - run: python -m pytest tests -q --basetemp=tests/.runs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-logs-${{ matrix.python }}
          path: |
            tests/.runs/**/last-run.log
            tests/.runs/**/logs/*.log


  report-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pytest 'playwright==1.64.1'
      - run: python tests/report_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybas-report-previews
          path: ui-previews/*.png
  native-controller:
    name: Native Conda controller retention
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: hybas
          environment-file: environment.yaml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify the native controller and retention contracts
        run: |
          snakemake --version
          python -c 'import importlib.metadata, snakemake; print("runtime:", snakemake.__version__); print("distribution:", importlib.metadata.version("snakemake"))'
          python -m pytest tests/test_artifact_retention.py -q
      - name: Verify recorded Snakemake version with synthetic tool stubs
        run: python -m pytest tests/test_workflow.py -k 'test_end_to_end_routes and illumina_only and none' -q

  native-output-retention:
    name: Native output retention (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: busco
            version: '6.0.0'
          - tool: flye
            version: '2.9.6'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: native-retention
          python-version: '3.11'
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - name: Install the unchanged pinned native package
        run: conda install --yes --strict-channel-priority '${{ matrix.tool }}=${{ matrix.version }}'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify actual package sources and retention behavior
        env:
          HYBAS_RETENTION_TOOL: ${{ matrix.tool }}
        run: |
          if [ "$HYBAS_RETENTION_TOOL" = busco ]; then
            export HYBAS_BUSCO_SOURCE=$(python -c 'import busco; from pathlib import Path; print(Path(busco.__file__).resolve().parent.parent)')
          else
            export HYBAS_FLYE_SOURCE=$(python -c 'import flye; from pathlib import Path; print(Path(flye.__file__).resolve().parent.parent)')
          fi
          python -m pytest tests/test_native_output_retention.py tests/test_${HYBAS_RETENTION_TOOL}_retention.py -q --basetemp=tests/.native-retention
      - name: Exercise the Flye launcher with actual native executables
        if: matrix.tool == 'flye'
        run: python tests/native_platform_smoke.py flye
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-retention-evidence-${{ matrix.tool }}
          include-hidden-files: true
          path: tests/.native-retention/**

  native-rendering:
    name: Native rendering (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Browser libraries are present, but Playwright's browser binaries are kept
    # outside Kaleido's normal discovery paths. Assert this before testing setup.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        environment: [qc, multiqc]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: render-check
          environment-file: workflow/envs/${{ matrix.environment }}.yml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - name: Require a fresh browser setup path
        if: matrix.environment == 'qc'
        run: |
          python - <<'PY'
          from choreographer.browsers.chromium import Chromium
          browser = Chromium.find_browser(skip_local=False)
          assert browser is None, f"Fresh browser setup test requires no discoverable Chrome: {browser}"
          PY
      - name: Check real CLI HTML and PNG output in the complete recipe
        env:
          HYBAS_PREPARE_BROWSER: ${{ matrix.environment == 'qc' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p render-evidence
          conda list --explicit > render-evidence/conda-explicit.txt
          conda list --json > render-evidence/conda-list.json
          python -m pip freeze --all > render-evidence/pip-freeze.txt
          python -m pip check
          bash workflow/envs/${{ matrix.environment }}.post-deploy.sh 2>&1 | tee render-evidence/render-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-rendering-${{ matrix.environment }}
          path: render-evidence/
          if-no-files-found: warn

  native-medaka:
    name: Native Medaka environment and model interface
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: medaka-check
          environment-file: workflow/envs/medaka.yml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - name: Check the installed Medaka CLI and mapping without inference
        run: |
          set -euo pipefail
          mkdir -p medaka-evidence
          conda list --explicit > medaka-evidence/conda-explicit.txt
          conda list --json > medaka-evidence/conda-list.json
          python -m pip check
          bash workflow/envs/medaka.post-deploy.sh 2>&1 | tee medaka-evidence/postdeploy.log
          medaka tools resolve_model --help > medaka-evidence/resolve-model-help.txt
          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path
          from medaka.options import basecaller_models
          version = importlib.metadata.version('medaka')
          assert version == '2.2.0', version
          mapping = dict(basecaller_models)
          assert mapping, 'Installed Medaka basecaller mapping is empty'
          Path('medaka-evidence/model-interface.json').write_text(json.dumps({
              'medaka_version': version,
              'basecaller_models': mapping,
              'scope': 'Installed model-selection interface only; no weights downloaded or inference run.',
          }, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-medaka-environment
          path: medaka-evidence/
          if-no-files-found: warn

  publish-report-release:
    needs: [regression, report-browser, native-controller, native-output-retention, native-rendering, native-medaka]
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked AWARE release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v10.0.0a5"
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            notes="$RUNNER_TEMP/hybas-release-notes.md"
            cat docs/RELEASE_10.0.0a5.md > "$notes"
            printf '\nTested source: `%s`. Required CI checks: %s/%s/actions/runs/%s.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes"
            gh release create "$tag" --target "$GITHUB_SHA" --title "HybAs AWARE 10.0.0a5 — Alpha" --prerelease --notes-file "$notes"
          fi

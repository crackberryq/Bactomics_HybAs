name: Workflow regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install snakemake==9.6.2 pytest pyyaml
      - run: python -m pytest tests -q --basetemp=tests/.runs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-logs-${{ matrix.python }}
          path: |
            tests/.runs/**/last-run.log
            tests/.runs/**/logs/*.log


  report-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pytest 'playwright==1.64.1'
      - run: python tests/report_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybas-report-previews
          path: ui-previews/*.png
  native-controller:
    name: Native Conda controller retention
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: hybas
          environment-file: environment.yaml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify the native controller and retention contracts
        run: |
          snakemake --version
          python -c 'import importlib.metadata, snakemake; print("runtime:", snakemake.__version__); print("distribution:", importlib.metadata.version("snakemake"))'
          python -m pytest tests/test_artifact_retention.py -q
      - name: Verify recorded Snakemake version with synthetic tool stubs
        run: python -m pytest tests/test_workflow.py -k 'test_end_to_end_routes and illumina_only and none' -q

  native-output-retention:
    name: Native output retention (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: busco
            version: '6.0.0'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: native-retention
          python-version: '3.11'
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - name: Install the unchanged pinned native package
        run: conda install --yes --strict-channel-priority '${{ matrix.tool }}=${{ matrix.version }}'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Verify actual package sources and retention behavior
        env:
          HYBAS_RETENTION_TOOL: ${{ matrix.tool }}
        run: |
          if [ "$HYBAS_RETENTION_TOOL" = busco ]; then
            export HYBAS_BUSCO_SOURCE=$(python -c 'import busco; from pathlib import Path; print(Path(busco.__file__).resolve().parent.parent)')
          else
            export HYBAS_FLYE_SOURCE=$(python -c 'import flye; from pathlib import Path; print(Path(flye.__file__).resolve().parent.parent)')
          fi
          python -m pytest tests/test_native_output_retention.py tests/test_${HYBAS_RETENTION_TOOL}_retention.py -q --basetemp=tests/.native-retention
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-retention-evidence-${{ matrix.tool }}
          include-hidden-files: true
          path: tests/.native-retention/**

  publish-report-release:
    needs: [regression, report-browser, native-controller, native-output-retention]
    if: github.ref == 'refs/heads/HybAs_v9.0.0-AWARE' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked AWARE release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hybas-v9.0.6-AWARE"
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "HybAs AWARE 9.0.6" --prerelease --notes-file docs/releases/v9.0.6-AWARE.md
          fi

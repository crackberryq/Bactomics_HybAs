name: Workflow regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install snakemake==9.27.1 pytest pyyaml
      - run: python -m pytest tests -q --basetemp=tests/.runs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-logs-${{ matrix.python }}
          path: |
            tests/.runs/**/last-run.log
            tests/.runs/**/logs/*.log


  report-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pytest 'playwright==1.64.1'
      - run: python tests/report_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybas-report-previews
          path: ui-previews/*.png
  publish-report-release:
    needs: [regression, report-browser]
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked AWARE release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v10.0.0a2"
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "HybAs AWARE 10.0.0a2" --prerelease --notes-file docs/RELEASE_10.0.0a2.md
          fi

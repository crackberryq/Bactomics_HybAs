name: Native environment checks
on:
  push:
    paths: ['workflow/envs/**', 'environment.yaml', '.github/workflows/environments.yml', 'tests/native_library_smoke.py', 'tests/native_platform_smoke.py']
  pull_request:
    paths: ['workflow/envs/**', 'environment.yaml', '.github/workflows/environments.yml', 'tests/native_library_smoke.py', 'tests/native_platform_smoke.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        environment: [assembly, library_assembly, library_preprocess, pacbio_assembly, polishing, medaka, qc, annotation]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: check
          environment-file: workflow/envs/${{ matrix.environment }}.yml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - run: bash workflow/envs/${{ matrix.environment }}.post-deploy.sh
      - if: matrix.environment == 'library_assembly'
        run: python tests/native_library_smoke.py
      - if: matrix.environment == 'library_preprocess'
        run: python tests/native_platform_smoke.py nxtrim
      - if: matrix.environment == 'pacbio_assembly'
        run: python tests/native_platform_smoke.py flye

  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: hybas
          environment-file: environment.yaml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - run: |
          cp config.example.yaml config.yaml
          cp examples/samples.example.tsv samples.tsv
          snakemake --version
          python -c 'import yaml; import snakemake'
          snakemake -s Hybas.smk setup_envs --config setup_only=true --cores 2 -n

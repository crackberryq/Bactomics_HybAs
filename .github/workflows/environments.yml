name: Native environment checks
on:
  push:
    paths: ['envs/**', 'environment.yaml', '.github/workflows/environments.yml']
  pull_request:
    paths: ['envs/**', 'environment.yaml', '.github/workflows/environments.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        environment: [assembly, polishing, medaka, qc, annotation]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: check
          environment-file: envs/${{ matrix.environment }}.yml
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: true
      - run: bash envs/${{ matrix.environment }}.post-deploy.sh
